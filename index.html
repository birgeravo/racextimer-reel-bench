<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RaceExTimer &mdash; Reel test bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens ===== */
:root{
  --natt:#130E0B; --torv:#1F1915; --bark:#362F29; --lin:#F1EEE9; --aske:#A59D95; --glod:#E66720;
  --sno:#FCFAF6; --ull:#F4F0E9; --stein:#DDD6CE; --kull:#1A1511; --skifer:#72665E;
  --mose:#65C67D; --fjord:#61B9EA;
  --chart1:oklch(0.72 0.16 50); --chart2:oklch(0.72 0.13 145); --chart3:oklch(0.72 0.12 235); --chart4:oklch(0.72 0.14 320); --chart5:oklch(0.72 0.12 85);
  --bg:var(--natt); --surface:var(--torv); --fill:var(--bark); --text:var(--lin); --text2:var(--aske); --border:var(--bark);
  --r-ctrl:8px; --r-panel:11px; --r-sheet:16px;
  --st: env(safe-area-inset-top,0px); --sb: env(safe-area-inset-bottom,0px); --sr: env(safe-area-inset-right,0px); --sl: env(safe-area-inset-left,0px);
  --topbar-h:44px;
  color-scheme: dark;
}
:root:not([data-theme="light"]){ }
:root[data-theme="light"]{
  --bg:var(--sno); --surface:#fff; --fill:var(--ull); --text:var(--kull); --text2:var(--skifer); --border:var(--stein);
  --chart1:oklch(0.66 0.16 50); --chart2:oklch(0.66 0.13 145); --chart3:oklch(0.66 0.12 235); --chart4:oklch(0.66 0.14 320); --chart5:oklch(0.66 0.12 85);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; background:var(--bg); }
html{ height:100%; box-sizing:border-box; padding-top:var(--st); padding-bottom:var(--sb); scroll-padding-top:var(--st); }
body{ height:100%; overflow:hidden; font-family:'Geist',system-ui,sans-serif; color:var(--text); background:var(--bg); }
img{ -webkit-user-drag:none; user-select:none; }
button{ font-family:inherit; }
.mono{ font-family:'Geist Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
.headline{ font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-stretch:80%; text-transform:uppercase; letter-spacing:.01em; }

#app{ position:fixed; inset:0; overflow:hidden; }

/* ===== background shader layer ===== */
#shaderLayer{ position:fixed; inset:0; z-index:0; background:var(--natt); overflow:hidden; }
#nordlysCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#shaderFallback{ position:absolute; inset:0; display:none; background:linear-gradient(160deg,var(--natt),var(--bark) 60%, #4a2a12 130%); }
#shaderLayer.fallback #nordlysCanvas{ display:none; }
#shaderLayer.fallback #shaderFallback{ display:block; }

/* ===== scroller / feed ===== */
.scroller{ position:fixed; inset:0; z-index:1; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; }
.scroller.stop-always .reel{ scroll-snap-stop:always; }
html.doc-scroll, html.doc-scroll body{ height:auto; overflow:visible; }
html.doc-scroll{ scroll-snap-type:y mandatory; scroll-snap-stop: normal; }
html.doc-scroll .scroller{ position:static; inset:auto; height:auto; overflow:visible; scroll-snap-type:none; }
html.doc-scroll .reel{ scroll-snap-align:start; }

html.unit-vh .reel{ height:100vh; }
html.unit-svh .reel{ height:100svh; }
html.unit-dvh .reel{ height:100dvh; }
.reel{ position:relative; width:100%; height:100svh; scroll-snap-align:start; overflow:hidden; background:var(--natt); }
.reel.placeholder{ background:var(--torv); }
.reel .reel-media{ position:absolute; inset:0; overflow:hidden; }
.reel .reel-media img.contain{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:2; }
.reel .reel-media img.cover{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:2; }
.reel .reel-media img.bgblur{ position:absolute; inset:-5%; width:110%; height:110%; object-fit:cover; filter:blur(34px) brightness(.6) saturate(1.1); z-index:1; transform:scale(1.12); }
.reel .reel-media.drift img.cover, .reel .reel-media.drift img.bgblur{ animation:kenburns 8s ease-in-out infinite alternate; }
.reel .reel-media.noblur img.bgblur{ display:none; }
@keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.04); } }

/* scene safe area guide */
.scene-safe{ position:absolute; left:16px; right:51px; top:57px; bottom:213px; z-index:3; pointer-events:none; }
.guide-lines .scene-safe{ outline:1px dashed rgba(230,103,32,.6); }
.guide-lines .guide-safearea{ position:absolute; inset:0; z-index:50; pointer-events:none; }
.guide-safearea .line{ position:absolute; left:0; right:0; border-top:1px dashed rgba(97,185,234,.7); font:10px 'Geist Mono',monospace; color:var(--fjord); }
.guide-safearea .line.top{ top:var(--st); } .guide-safearea .line.bottom{ bottom:var(--sb); }

.scrim{ position:absolute; left:0; right:0; bottom:0; height:56%; z-index:4; pointer-events:none;
  background:linear-gradient(to top, rgba(19,14,11,.7), rgba(19,14,11,0)); }
[data-theme="light"] .scrim{ background:linear-gradient(to top, rgba(252,250,246,.75), rgba(252,250,246,0)); }

/* action rail */
.action-rail{ position:absolute; right:8px; bottom:213px; width:51px; z-index:6; display:flex; flex-direction:column; align-items:center; gap:16px; }
.action-rail .avatar{ width:40px; height:40px; border-radius:999px; overflow:hidden; border:2px solid var(--lin); background:var(--fill); }
.action-rail .avatar img{ width:100%; height:100%; object-fit:cover; }
.action-rail .act{ background:none; border:none; color:var(--lin); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:22px; line-height:1; cursor:pointer; padding:2px; }
.action-rail .act .cnt{ font-family:'Geist Mono',monospace; font-size:11px; color:var(--lin); }
.action-rail .act.liked{ color:var(--glod); }

/* caption */
.caption-stack{ position:absolute; left:16px; right:67px; bottom:52px; z-index:6; max-width:323px; }
.cap-sentence{ font-family:'Geist',sans-serif; font-weight:600; font-size:15px; line-height:1.3; color:var(--lin); }
.cap-meta{ font-size:13px; color:var(--aske); margin-top:2px; }
.cap-note{ font-size:13px; color:var(--lin); margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; opacity:.92; }
.comment-peek{ position:absolute; left:16px; right:16px; bottom:14px; z-index:6; border-top:1px solid rgba(241,238,233,.18); padding-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.comment-peek .line{ font-size:13px; color:var(--lin); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.comment-peek .line b{ font-weight:600; }
.comment-peek .more{ font-size:12px; color:var(--aske); font-family:'Geist Mono',monospace; white-space:nowrap; background:none; border:none; }

/* carousel */
.carousel-track{ position:absolute; inset:0; display:flex; height:100%; width:100%; overflow:hidden; z-index:2; touch-action:pan-y; }
.carousel-card{ position:relative; flex:0 0 100%; height:100%; }
.carousel-progress{ position:absolute; top:calc(var(--st) + 52px); left:16px; right:16px; z-index:8; display:flex; gap:4px; }
.carousel-progress .seg{ flex:1; height:2px; background:rgba(241,238,233,.3); border-radius:2px; overflow:hidden; }
.carousel-progress .seg i{ display:block; height:100%; width:0%; background:var(--lin); }
.carousel-progress .seg.done i{ width:100%; }
.carousel-progress .seg.active i{ animation:segfill linear forwards; animation-duration: var(--seg-dur,5s); }
@keyframes segfill{ from{width:0%;} to{width:100%;} }

/* top bar */
#topBar{ position:fixed; top:var(--st); left:0; right:0; height:44px; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:0 10px; color:#fff; font-size:13px; pointer-events:none; }
#topBar *{ pointer-events:auto; }
#topBar .tb-logo{ font-family:'Archivo',sans-serif; font-weight:800; font-stretch:82%; text-transform:uppercase; font-size:13px; }
#topBar .tb-mid{ display:flex; align-items:center; gap:5px; font-family:'Geist Mono',monospace; font-size:12px; }
.live-dot{ width:7px; height:7px; border-radius:50%; background:var(--glod); box-shadow:0 0 0 0 rgba(230,103,32,.6); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(230,103,32,.55);} 70%{box-shadow:0 0 0 8px rgba(230,103,32,0);} 100%{box-shadow:0 0 0 0 rgba(230,103,32,0);} }
#topBar .tb-right{ display:flex; gap:6px; }
#topBar button{ background:rgba(19,14,11,.55); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:var(--r-ctrl); padding:6px 10px; font-size:12px; }

/* frame banner */
#frameBanner{ position:fixed; top:calc(var(--st) + 44px); left:8px; right:8px; z-index:60; background:var(--glod); color:var(--kull); border-radius:var(--r-ctrl); padding:8px 10px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
#frameBanner a{ color:var(--kull); font-weight:700; text-decoration:underline; white-space:nowrap; }

/* test panel */
#testPanel{ position:fixed; left:0; right:0; bottom:0; z-index:70; background:rgba(31,25,21,.92); backdrop-filter:blur(10px); border-top:1px solid var(--border); border-radius:var(--r-sheet) var(--r-sheet) 0 0; padding-bottom:var(--sb); max-height:66vh; display:flex; flex-direction:column; transition:transform .25s ease; color:var(--lin); font-size:13px; }
[data-theme="light"] #testPanel{ background:rgba(255,255,255,.92); color:var(--kull); }
#testPanel.collapsed{ transform:translateY(calc(100% - 40px)); }
#testPanelHandle{ height:40px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; flex:0 0 auto; }
#testPanelHandle .grip{ width:36px; height:4px; border-radius:2px; background:var(--text2); }
#testPanelHandle .tp-label{ position:absolute; left:14px; font-family:'Geist Mono',monospace; font-size:11px; color:var(--text2); }
#testPanelBody{ overflow-y:auto; padding:0 14px 14px; }
#testPanelBody h3{ font-family:'Archivo',sans-serif; font-stretch:80%; font-weight:800; text-transform:uppercase; font-size:14px; margin:4px 0 6px; }
#testPanelBody p.instr{ margin:0 0 10px; opacity:.85; line-height:1.4; }
.metric-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; background:var(--fill); border-radius:var(--r-panel); padding:10px; margin-bottom:10px; font-family:'Geist Mono',monospace; font-size:12px; }
.metric-grid .k{ color:var(--text2); } .metric-grid .v{ text-align:right; }
.metric-log{ background:var(--fill); border-radius:var(--r-panel); padding:8px 10px; margin-bottom:10px; font-family:'Geist Mono',monospace; font-size:11px; max-height:110px; overflow-y:auto; }
.tp-controls{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.tp-controls label{ display:flex; align-items:center; gap:6px; background:var(--fill); border-radius:var(--r-ctrl); padding:6px 9px; font-size:12px; }
.tp-controls input[type=range]{ width:90px; }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.btn{ background:var(--fill); color:var(--text); border:1px solid var(--border); border-radius:var(--r-ctrl); padding:8px 12px; font-size:13px; cursor:pointer; }
.btn.primary{ background:var(--glod); color:var(--kull); border-color:var(--glod); font-weight:700; }
.btn.active{ outline:2px solid var(--glod); }
.verdict-row{ display:flex; gap:6px; margin-bottom:8px; }
.verdict-row .btn{ flex:1; text-align:center; }
.verdict-row .btn[data-v=works].sel{ background:var(--mose); color:var(--kull); border-color:var(--mose); }
.verdict-row .btn[data-v=janky].sel{ background:#E6C560; color:var(--kull); border-color:#E6C560; }
.verdict-row .btn[data-v=broken].sel{ background:#E66060; color:#fff; border-color:#E66060; }
#tpNote{ width:100%; background:var(--fill); border:1px solid var(--border); border-radius:var(--r-ctrl); color:var(--text); padding:8px 10px; margin-bottom:8px; font-size:13px; }
.prefer-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.prefer-row .btn.sel{ background:var(--fjord); color:var(--kull); border-color:var(--fjord); }
#tpSaveRow{ display:flex; gap:8px; align-items:center; }
#tpSaved{ font-size:11px; color:var(--mose); }

/* modals */
.modal{ position:fixed; inset:0; z-index:100; background:rgba(19,14,11,.7); display:flex; align-items:flex-end; }
.modal .sheet{ background:var(--surface); width:100%; max-height:82vh; border-radius:var(--r-sheet) var(--r-sheet) 0 0; padding:16px 16px calc(16px + var(--sb)); overflow-y:auto; color:var(--text); }
.modal h2{ font-family:'Archivo',sans-serif; font-weight:800; font-stretch:80%; text-transform:uppercase; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; font-size:16px; }
.modal .close{ background:var(--fill); border:none; color:var(--text); border-radius:999px; width:44px; height:44px; font-size:20px; flex:0 0 auto; }
.modal .close-bottom{ display:block; width:100%; margin-top:14px; padding:12px; }
.test-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 8px; border-radius:var(--r-ctrl); }
.test-item:active{ background:var(--fill); }
.test-item .num{ font-family:'Geist Mono',monospace; color:var(--glod); width:24px; }
.test-item .nm{ flex:1; margin-left:6px; }
.test-item .stat{ font-family:'Geist Mono',monospace; font-size:11px; color:var(--text2); }
.result-row{ border-bottom:1px solid var(--border); padding:10px 0; font-size:12px; }
.result-row .rr-top{ display:flex; justify-content:space-between; font-family:'Geist Mono',monospace; margin-bottom:3px; }
.result-row .rr-v{ font-weight:700; }
.result-row .rr-v.works{ color:var(--mose);} .result-row .rr-v.janky{ color:#E6C560;} .result-row .rr-v.broken{ color:#E66060;}
#resultsJson{ width:100%; height:140px; font-family:'Geist Mono',monospace; font-size:10px; background:var(--fill); color:var(--text); border:1px solid var(--border); border-radius:var(--r-ctrl); margin-top:8px; }

/* device row */
.device-row{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
.device-row input{ flex:1; background:var(--fill); border:1px solid var(--border); color:var(--text); border-radius:var(--r-ctrl); padding:8px 10px; font-size:13px; }

/* pause icon */
.pause-flag{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:20; width:64px; height:64px; border-radius:999px; background:rgba(19,14,11,.55); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .15s; }
.pause-flag.show{ opacity:1; }
.pause-flag svg{ width:28px; height:28px; fill:#fff; }
.action-log{ position:absolute; top:120px; left:16px; z-index:20; background:rgba(19,14,11,.6); color:var(--lin); font-family:'Geist Mono',monospace; font-size:11px; padding:4px 8px; border-radius:6px; opacity:0; transition:opacity .2s; }
.action-log.show{ opacity:1; }

.particle-canvas{ position:absolute; inset:0; z-index:15; pointer-events:none; }

/* finish scene */
.finish-scene{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:70px; z-index:3; }
.fs-course{ width:220px; height:200px; }
.fs-course path.route{ fill:none; stroke:var(--bark); stroke-width:3; }
.fs-course path.draw{ fill:none; stroke:var(--glod); stroke-width:3; stroke-linecap:round; }
.fs-course circle.tick{ fill:var(--fjord); opacity:0; }
.fs-course circle.dot{ fill:var(--glod); filter:drop-shadow(0 0 6px var(--glod)); }
.fs-time{ margin-top:6px; display:flex; }
.fs-digit-col{ position:relative; width:26px; height:44px; overflow:hidden; font-family:'Geist Mono',monospace; font-weight:600; font-size:38px; }
.fs-digit-col.static{ display:flex; align-items:center; justify-content:center; width:14px; color:var(--text2); }
.fs-digit-col .strip{ position:absolute; left:0; top:0; display:flex; flex-direction:column; }
.fs-digit-col .strip span{ height:44px; display:flex; align-items:center; justify-content:center; color:var(--lin); }
.fs-digit-col.tenths .strip span{ color:var(--glod); }
.fs-hist{ display:flex; align-items:flex-end; gap:2px; height:54px; width:280px; margin-top:14px; }
.fs-hist .bar{ flex:1; background:var(--chart3); transform:scaleY(0); transform-origin:bottom; border-radius:1px 1px 0 0; }
.fs-hist .bar.mine{ background:var(--glod); }
.fs-rank{ font-family:'Geist Mono',monospace; margin-top:8px; font-size:14px; color:var(--lin); }
.fs-rank b{ color:var(--glod); }
.fs-badges{ display:flex; gap:8px; margin-top:12px; }
.fs-badge{ padding:5px 10px; border-radius:999px; font-size:11px; font-weight:700; opacity:0; transform:scale(.6); }
.fs-badge.official{ background:rgba(101,198,125,.15); color:var(--mose); }
.fs-badge.pb{ background:rgba(97,185,234,.15); color:var(--fjord); }

/* PB variant extras */
.fs-old-time{ font-family:'Geist Mono',monospace; font-size:18px; color:var(--text2); position:relative; margin-bottom:4px; }
.fs-old-time .strike{ position:absolute; left:0; top:50%; height:2px; width:0; background:var(--text2); }
.fs-new-time{ font-family:'Geist Mono',monospace; font-size:40px; font-weight:700; color:var(--lin); filter:blur(6px); opacity:0; transform:scale(1.4); }
.fs-ring{ position:absolute; border:2px solid var(--glod); border-radius:999px; opacity:0; }
.fs-spark{ position:absolute; background:var(--glod); }
.fs-delta{ color:var(--glod); font-family:'Geist Mono',monospace; font-size:16px; margin-top:6px; opacity:0; }
.fs-spark-line{ width:200px; height:36px; margin-top:10px; }
.fs-spark-line path{ fill:none; stroke:var(--fjord); stroke-width:2; }

/* comment sheet variant A */
#commentSheet{ position:fixed; left:0; right:0; bottom:0; height:65%; z-index:55; background:var(--surface); border-radius:var(--r-sheet) var(--r-sheet) 0 0; transform:translateY(100%); transition:transform .28s ease; padding-bottom:var(--sb); display:flex; flex-direction:column; }
#commentSheet.open{ transform:translateY(0); }
#commentSheet .csheet-handle{ padding:10px; display:flex; justify-content:center; }
#commentSheet .csheet-handle .grip{ width:36px; height:4px; border-radius:2px; background:var(--text2); }
#commentSheet .csheet-list{ overflow-y:auto; padding:0 14px 14px; flex:1; }
#commentSheet .c-row{ display:flex; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
#commentSheet .c-row .c-av{ width:28px; height:28px; border-radius:999px; background:var(--fill); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:0 0 auto; }
.reel.scaled-up{ transform:scale(.86) translateY(-14%); transform-origin:top center; transition:transform .28s ease; border-radius:var(--r-panel); overflow:hidden; }

/* comments-ext (variant B) */
.reel.comments-ext{ background:var(--torv); overflow-y:auto; padding:60px 16px 24px; }
[data-theme="light"] .reel.comments-ext{ background:#fff; }
.reel.comments-ext .c-row{ display:flex; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--text); }
.reel.comments-ext .c-av{ width:30px; height:30px; border-radius:999px; background:var(--fill); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:0 0 auto; color:var(--text); }
.reel.comments-ext h4{ font-family:'Archivo',sans-serif; font-weight:800; font-stretch:80%; text-transform:uppercase; font-size:13px; color:var(--text2); }

/* fps meter / small overlays used by tests */
.fps-badge{ position:absolute; top:96px; right:16px; z-index:20; font-family:'Geist Mono',monospace; font-size:11px; background:rgba(19,14,11,.6); color:var(--lin); padding:4px 8px; border-radius:6px; }

/* view-timeline transitions (test12), applied only if supported */
html.vt-on .reel{ animation: vt-leave linear both; animation-timeline: view(); animation-range: cover 0% cover 45%; }
@keyframes vt-leave{ from{ transform:scale(1); opacity:1; } to{ transform:scale(.94); opacity:.55; } }

::-webkit-scrollbar{ width:0; height:0; }

</style>
</head>
<body>
<div id="app">
  <div id="shaderLayer"><canvas id="nordlysCanvas"></canvas><div id="shaderFallback"></div></div>

  <div id="scrollerFixed" class="scroller"></div>
  <div id="enduranceScroller" style="position:fixed;inset:0;z-index:35;overflow-y:scroll;display:none;background:var(--natt);"></div>

  <div class="guide-safearea" style="display:none" id="guideSafearea">
    <div class="line top"></div><div class="line bottom"></div>
  </div>

  <div id="topBar">
    <div class="tb-left"><span class="tb-logo">RaceExTimer</span></div>
    <div class="tb-mid"><span class="live-dot"></span>LIVE <span id="liveCount">2</span></div>
    <div class="tb-right"><button id="btnTests">Tests</button><button id="btnResults">Results</button></div>
  </div>

  <div id="frameBanner" hidden>
    <span>Running inside claude.ai's frame &mdash; scrolling/toolbar behavior may differ from a real tab.</span>
    <a id="openTopLevelLink" href="#">Open full page &rsaquo;</a>
  </div>

  <div id="commentSheet">

  // "41:40.3" -> seconds (float), "44:40.0" -> seconds, allow "M:SS.t" or "MM:SS.t"

  return min * 60 + sec + tenth / 10;
}

  s = Math.max(0, s);

  var rem = s - min * 60;
  var sec = Math.floor(rem);
  var tenth = Math.round((rem - sec) * 10);
  if (tenth === 10) { tenth = 0; sec += 1; }

  return min + ':' + String(sec).padStart(2, '0') + '.' + tenth;

  var host = qs('#enduranceScroller');
  qsa('.end-reel', host).forEach(function (sec) {
    var i = +sec.dataset.i, dist = Math.abs(i - centerIdx);
    var templ = REELS[i % 20];
    if (dist <= 1) { if (sec.dataset.mode !== 'full') { sec.dataset.mode = 'full'; sec.className = 'end-reel reel'; sec.innerHTML = buildReelInner(templ, i); } }
    else if (dist <= 2) { if (sec.dataset.mode !== 'static') { sec.dataset.mode = 'static'; sec.className = 'end-reel'; sec.innerHTML = buildEndFrameHtml(templ); } }
    else { if (sec.dataset.mode !== 'empty') { sec.dataset.mode = 'empty'; sec.className = 'end-reel placeholder'; sec.innerHTML = ''; } }
  });
}
function runAutoSwipe100() {
  if (END.running) return;
  END.running = true; END.longtaskCount = 0; END.droppedFrames = 0; END.progress = 0;
  END.memStart = memSnap(); END.mem10 = null; END.mem100 = null;
  buildEnduranceDom();
  var host = qs('#enduranceScroller');
  host.style.display = 'block';
  var h = window.innerHeight;
  startDropFrameMonitor();
  var i = 0;
  function step() {
    updateEnduranceWindow(i);
    host.scrollTop = i * h;
    END.progress = i + 1;
    if (i === 9) END.mem10 = memSnap();
    if (i >= 99) {
      END.mem100 = memSnap();
      stopDropFrameMonitor();
      END.running = false;
      setTimeout(function () { host.style.display = 'none'; }, 400);
      return;
    }
    i++;
    setTimeout(step, 130);
  }
  step();
}

// ============ test 10: haptics ============
var lastVibrateResult = null;
function tryVibrate() {
  if (!DEVICE.vibrate) { lastVibrateResult = 'navigator.vibrate not present'; return; }
  try { var ok = navigator.vibrate(10); lastVibrateResult = ok ? 'called (10ms)' : 'call returned false'; }
  catch (e) { lastVibrateResult = 'threw: ' + e.message; }
}

// ============ test registry ============
var TESTS = [
  { id: 1, name: 'Height stability', instructions: 'Scroll the feed. Watch innerHeight / visualViewport / vh-svh-dvh probes and whether the browser toolbar collapses.',
    controls: function () { return [
      { type: 'select', label: 'Scroller', options: ['fixed', 'doc'], get: function () { return UI.scrollerMode; }, set: function (v) { UI.scrollerMode = v; renderFeed(); } },
      { type: 'select', label: 'Reel height unit', options: ['vh', 'svh', 'dvh'], get: function () { return UI.heightUnit; }, set: function (v) { UI.heightUnit = v; applyContainerModeClasses(); } },
      { type: 'toggle', label: 'Safe-area guide lines', get: function () { return UI.guideLines; }, set: function (v) { UI.guideLines = v; applyContainerModeClasses(); } },
      { type: 'toggle', label: 'viewport-fit=cover', get: function () { return UI.viewportFit; }, set: function (v) { UI.viewportFit = v; setViewportFit(v); } },
      { type: 'button', label: 'Reset min/max', onClick: function () { HS.innerMin = Infinity; HS.innerMax = -Infinity; HS.vvMin = Infinity; HS.vvMax = -Infinity; HS.toolbarCollapsed = false; HS.baselineInner = window.innerHeight; } }
    ]; },
    metrics: function () { return {
      'innerHeight now': window.innerHeight, 'innerHeight min/max': HS.innerMin + ' / ' + HS.innerMax,
      'visualViewport now': window.visualViewport ? Math.round(window.visualViewport.height) : 'n/a',
      'visualViewport min/max': (HS.vvMin === Infinity ? 'n/a' : HS.vvMin + ' / ' + HS.vvMax),
      '100vh probe': readProbe('#probeVh') + 'px', '100svh probe': readProbe('#probeSvh') + 'px', '100dvh probe': readProbe('#probeDvh') + 'px',
      'toolbar collapsed seen': HS.toolbarCollapsed ? 'yes' : 'no', 'samples': HS.samples
    }; } },
  { id: 2, name: 'One reel per fling', instructions: 'Fling vertically. A hard fling should never move more than one reel. Toggle scroll-snap-stop and compare.',
    controls: function () { return [
      { type: 'toggle', label: 'scroll-snap-stop: always', get: function () { return UI.snapStop; }, set: function (v) { UI.snapStop = v; applyContainerModeClasses(); } },
      { type: 'button', label: 'Reset tally', onClick: function () { flingStats.flings = 0; flingStats.skipped = 0; } }
    ]; },
    metrics: function () { return { 'flings': flingStats.flings, 'skipped (>1 reel)': flingStats.skipped, 'pass': flingStats.flings ? (flingStats.skipped === 0 ? 'yes' : 'no') : '\u2014' }; } },
  { id: 3, name: 'Nested carousel', instructions: 'Open a carousel reel (e.g. Nora\u2019s photo dump). Swipe horizontally on cards, tap left/right quarters, and try a diagonal swipe to check axis handling.',
    controls: function () { return [{ type: 'button', label: 'Clear log', onClick: function () { axisEvents = []; } }]; },
    metrics: function () { return { 'axis events logged': axisEvents.length }; },
    log: function () { return axisEvents; } },
  { id: 4, name: 'Tap / double-tap / hold', instructions: 'Tap center to pause/resume, double-tap to cheer, press and hold to pause while held.',
    controls: function () { return [{ type: 'slider', label: 'Double-tap window (ms)', min: 150, max: 350, step: 10, get: function () { return UI.doubleTapMs; }, set: function (v) { UI.doubleTapMs = v; } }]; },
    metrics: function () { return { 'last action': lastFiredAction, 'cheers this session': tap4Cheers }; } },
  { id: 5, name: 'Comments A vs B', instructions: 'A: peek + bottom sheet at 65% height. B: scroll continues into a comment thread section. Pick which reads better.',
    preferLabels: ['A', 'B'],
    controls: function () { return [{ type: 'select', label: 'Variant', options: ['A', 'B'], get: function () { return UI.commentsVariant; }, set: function (v) { UI.commentsVariant = v; renderFeed(); } }]; },
    metrics: function () { return { 'variant': UI.commentsVariant, 'comments on active reel': REELS[activeIndex] ? REELS[activeIndex].comments.length : 0 }; } },
  { id: 6, name: 'Finish scene (Motion)', instructions: 'Watch the finish-line scene play on entering a data-driven reel. Try the PB reel (Hanna Strand) for the personal-best beats.',
    controls: function () { return [
      { type: 'toggle', label: 'Force reduced motion (end-frame only)', get: function () { return UI.reducedMotionForce; }, set: function (v) { UI.reducedMotionForce = v; replayActiveScene(); } },
      { type: 'button', label: 'Replay scene', onClick: replayActiveScene }
    ]; },
    metrics: function () { return { 'active reel type': REELS[activeIndex] ? REELS[activeIndex].type : '\u2014', 'prefers-reduced-motion (OS)': DEVICE.reducedMotion ? 'yes' : 'no', 'Motion lib': (window.Motion ? 'loaded' : 'fallback tween only') }; } },
  { id: 7, name: 'Nordlys shader', instructions: 'One fixed WebGL canvas behind the feed. Compare FPS with the shader on vs off, and during a scene intro vs idle.',
    controls: function () { return [{ type: 'toggle', label: 'Shader on', get: function () { return UI.shaderOn; }, set: function (v) { UI.shaderOn = v; if (v) { setShaderFallback(GL.lost || !GL.ctx); startShaderLoop(); } else { stopShaderLoop(); setShaderFallback(true); } } }]; },
    metrics: function () { return { 'webgl supported': DEVICE.webgl ? 'yes' : 'no', 'context lost': GL.lost ? 'yes' : 'no', 'running': GL.running ? 'yes' : 'no', 'fps (intro)': fpsAvg(GL.fpsIntro), 'fps (idle)': fpsAvg(GL.fpsIdle) }; } },
  { id: 8, name: 'Photos', instructions: 'Portrait photos fill the screen (object-cover). Landscape photos sit whole over a blurred Ken-Burns background.',
    controls: function () { return [
      { type: 'toggle', label: 'Ken Burns drift', get: function () { return UI.driftOn; }, set: function (v) { UI.driftOn = v; qsa('.reel-media').forEach(function (m) { m.classList.toggle('drift', v); }); } },
      { type: 'toggle', label: 'Blurred background', get: function () { return UI.blurOn; }, set: function (v) { UI.blurOn = v; qsa('.reel-media').forEach(function (m) { m.classList.toggle('noblur', !v); }); } }
    ]; },
    metrics: function () { var r = REELS[activeIndex]; return { 'active reel type': r ? r.type : '\u2014', 'orientation': r && r.photo ? (isPortrait(r.photo) ? 'portrait' : 'landscape') : (r && r.type === 'carousel' ? 'carousel' : '\u2014') }; } },
  { id: 9, name: 'Endurance (100 reels)', instructions: 'Auto-swipes through 100 virtual reels. Mounts active\u00b11 in full, \u00b12 as static frames, rest as empty placeholders.',
    controls: function () { return [{ type: 'button', label: END.running ? 'Running\u2026' : 'Auto-swipe 100', onClick: function () { if (!DEVICE.longtask) {} setupLongtaskObserver(); runAutoSwipe100(); } }]; },
    metrics: function () { return {
      'progress': END.progress + ' / 100', 'longtasks (>50ms)': DEVICE.longtask ? END.longtaskCount : 'not supported here',
      'dropped frames': END.droppedFrames, 'memory @start': END.memStart || (DEVICE.memoryAPI ? '\u2014' : 'not supported (no performance.memory)'),
      'memory @10': END.mem10 || '\u2014', 'memory @100': END.mem100 || '\u2014'
    }; } },
  { id: 10, name: 'Haptics', instructions: 'Tap the button to call navigator.vibrate(10). Expect nothing on iOS Safari \u2014 that is the correct result there.',
    controls: function () { return [{ type: 'button', label: 'Vibrate 10ms', onClick: tryVibrate }]; },
    metrics: function () { return { 'navigator.vibrate present': DEVICE.vibrate ? 'yes' : 'no', 'last call': lastVibrateResult || '\u2014' }; } },
  { id: 11, name: 'Dark vs light stage', instructions: 'Toggle the whole stage between the dark theme and the light alternative, then pick one.',
    preferLabels: ['Dark', 'Light'],
    controls: function () { return [{ type: 'select', label: 'Theme', options: ['dark', 'light'], get: function () { return UI.theme; }, set: function (v) { UI.theme = v; applyContainerModeClasses(); } }]; },
    metrics: function () { return { 'theme': UI.theme }; } },
  { id: 12, name: 'View-timeline transition', instructions: 'A leaving reel should scale to 0.94 and dim via animation-timeline: view(). No fallback is applied where unsupported.',
    controls: function () { return [{ type: 'toggle', label: 'Enable transition', get: function () { return UI.vtOn; }, set: function (v) { UI.vtOn = v; applyContainerModeClasses(); } }]; },
    metrics: function () { return { '@supports animation-timeline:view()': DEVICE.viewTimeline ? 'true' : 'false', 'enabled': UI.vtOn ? 'yes' : 'no' }; } }
];
function replayActiveScene() {
  var r = REELS[activeIndex]; if (!r || (r.type !== 'finish' && r.type !== 'finish-pb')) return;
  stopFinishScene(reelEls[activeIndex], r); playFinishScene(reelEls[activeIndex], r);
}

// ============ panel state per test (verdict/note/prefer, session-scoped) ============
var panelState = {};
function psFor(id) { if (!panelState[id]) panelState[id] = { verdict: null, note: '', prefer: null }; return panelState[id]; }

function switchTest(i) {
  UI.testIndex = clamp(i, 0, TESTS.length - 1); saveUiPrefs();
  renderTestPanel();
}
function renderTestPanel() {
  var t = TESTS[UI.testIndex];
  qs('#tpTitle').textContent = t.id + '. ' + t.name;
  qs('#tpInstructions').textContent = t.instructions;
  renderControls(t.controls ? t.controls() : []);
  var ps = psFor(t.id);
  qsa('.verdict-row .btn').forEach(function (b) { b.classList.toggle('sel', b.dataset.v === ps.verdict); });
  qs('#tpNote').value = ps.note || '';
  var preferRow = qs('#tpPrefer');
  if (t.preferLabels) {
    preferRow.hidden = false;
    qsa('.btn', preferRow).forEach(function (b) {
      b.textContent = 'Prefer ' + t.preferLabels[b.dataset.p === 'A' ? 0 : 1];
      b.classList.toggle('sel', ps.prefer === t.preferLabels[b.dataset.p === 'A' ? 0 : 1]);
    });
  } else preferRow.hidden = true;
  qs('#tpSaved').textContent = '';
  updatePanelMetrics();
}
function updatePanelMetrics() {
  var t = TESTS[UI.testIndex]; if (!t) return;
  renderMetrics(t.metrics ? t.metrics() : {});
  renderLog(t.log ? t.log() : null);
}

// ============ results: save / list / copy (db-backed, session fallback) ============
function keySafe(s) { return String(s || 'device').replace(/[^a-zA-Z0-9_-]+/g, '_'); }
async function saveResult() {
  var t = TESTS[UI.testIndex]; var ps = psFor(t.id);
  var docId = keySafe(UI.deviceKey) + '__test' + t.id;
  var doc = {
    device: UI.deviceKey, testId: t.id, testName: t.name, verdict: ps.verdict, note: ps.note, prefer: ps.prefer,
    metrics: t.metrics ? t.metrics() : {}, ua: DEVICE.ua, viewport: DEVICE.viewport, dpr: DEVICE.dpr,
    framed: DEVICE.framed, savedAt: new Date().toISOString()
  };
  SESSION_RESULTS[docId] = doc;
  persistSessionResults();
  var flash = qs('#tpSaved');
  if (CAP.db) {
    try { await CAP.db.doc('results/' + docId).set(doc); flash.textContent = 'Saved \u2713'; flash.style.color = 'var(--mose)'; }
    catch (e) { flash.textContent = 'Save failed: ' + e.message; flash.style.color = '#E66060'; }
  } else { flash.textContent = 'Saved on this device (db unavailable \u2014 not shared across phones)'; flash.style.color = '#E6C560'; }
}
async function loadAllResults() {
  if (CAP.db) {
    try {
      var snap = await CAP.db.collection('results').limit(500).get();
      var out = {};
      snap.docs.forEach(function (d) { out[d.id] = d.data(); });
      return out;
    } catch (e) { return SESSION_RESULTS; }
  }
  return SESSION_RESULTS;
}
async function renderResultsModal() {
  var host = qs('#resultsList');
  host.innerHTML = '<div style="opacity:.6;font-size:12px;">Loading\u2026</div>';
  var all = await loadAllResults();
  var rows = Object.keys(all).map(function (k) { return all[k]; }).sort(function (a, b) { return (a.testId - b.testId) || (a.device || '').localeCompare(b.device || ''); });
  if (!rows.length) { host.innerHTML = '<div style="opacity:.6;font-size:12px;">No results saved yet.</div>'; }
  else {
    host.innerHTML = rows.map(function (r) {
      return '<div class="result-row"><div class="rr-top"><span>' + esc(r.device) + ' \u00b7 test ' + r.testId + ' ' + esc(r.testName || '') + '</span><span class="rr-v ' + (r.verdict || '') + '">' + esc(r.verdict || '\u2014') + '</span></div>' +
        (r.prefer ? '<div>prefers: ' + esc(r.prefer) + '</div>' : '') +
        (r.note ? '<div>note: ' + esc(r.note) + '</div>' : '') + '</div>';
    }).join('');
  }
  qs('#resultsJson').value = JSON.stringify(rows, null, 2);
}

// ============ modals / topbar / verdict wiring ============
function wireModals() {
  qs('#btnTests').addEventListener('click', function () { renderTestsList(); qs('#testsModal').hidden = false; });
  qs('#btnResults').addEventListener('click', function () { qs('#resultsModal').hidden = false; renderResultsModal(); });
  qsa('.modal .close, .modal [data-modal-close]').forEach(function (b) { b.addEventListener('click', function () { b.closest('.modal').hidden = true; }); });
  qsa('.modal').forEach(function (m) { m.addEventListener('click', function (e) { if (e.target === m) m.hidden = true; }); });
  qs('#btnCopyJson').addEventListener('click', function () {
    navigator.clipboard.writeText(qs('#resultsJson').value).then(function () {
      var b = qs('#btnCopyJson'); var old = b.textContent; b.textContent = 'Copied \u2713'; setTimeout(function () { b.textContent = old; }, 1200);
    });
  });
  qs('#deviceKeyInput').addEventListener('change', function (e) { UI.deviceKey = e.target.value.trim() || DEVICE.guessKey; saveUiPrefs(); });
  qs('#closeCommentSheet').addEventListener('click', closeCommentSheet);
  qs('#commentSheet').addEventListener('click', function (e) { if (e.target.id === 'commentSheet') closeCommentSheet(); });
  qs('#openTopLevelLink').addEventListener('click', function (e) { e.preventDefault(); window.open(location.href, '_blank'); });
}
function renderTestsList() {
  qs('#deviceKeyInput').value = UI.deviceKey;
  var host = qs('#testsList'); host.innerHTML = '';
  TESTS.forEach(function (t, i) {
    var row = el('div', 'test-item', '<span class="num">' + t.id + '</span><span class="nm">' + esc(t.name) + '</span><span class="stat">' + (psFor(t.id).verdict || '') + '</span>');
    row.addEventListener('click', function () { switchTest(i); qs('#testsModal').hidden = true; qs('#testPanel').classList.remove('collapsed'); });
    host.appendChild(row);
  });
}
function wireTopBarButtons() {
  qs('#testPanelHandle').addEventListener('click', function () { qs('#testPanel').classList.toggle('collapsed'); });
  qsa('.verdict-row .btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = TESTS[UI.testIndex]; var ps = psFor(t.id); ps.verdict = b.dataset.v; renderTestPanel();
    });
  });
  qsa('#tpPrefer .btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = TESTS[UI.testIndex]; var ps = psFor(t.id);
      var label = t.preferLabels[b.dataset.p === 'A' ? 0 : 1];
      ps.prefer = label; renderTestPanel();
    });
  });
  qs('#tpNote').addEventListener('input', function (e) { psFor(TESTS[UI.testIndex].id).note = e.target.value; });
  qs('#tpSave').addEventListener('click', saveResult);
}
function showFrameBanner() { qs('#frameBanner').hidden = false; }

// ============ boot ============
function onActiveReelChanged(prev, idx) {
  crossfadePalette(idx);
  updateEnduranceWindow ? null : null;
}
function boot() {
  detectDevice();
  loadUiPrefs();
  document.documentElement.setAttribute('data-theme', UI.theme);
  qs('#deviceKeyInput').value = UI.deviceKey;
  renderFeed();
  wireKeyboard();
  wireCommentSheetDrag();
  wireTopBarButtons();
  wireModals();
  initShader();
  switchTest(UI.testIndex || 0);
  setInterval(updatePanelMetrics, 300);
  setupHeightStabilityTracking();
  setupLongtaskObserver();
  if (DEVICE.framed) showFrameBanner();
  initCapabilities();
}
boot();

</script>
